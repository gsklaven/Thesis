---
# Data Assurance Policy Management Playbook
#
# Manages Graphiant Data Assurance policies via the portal API.
#
# Auth: either set GRAPHIANT_ACCESS_TOKEN (e.g. graphiant login; source ~/.graphiant/env.sh)
# or set GRAPHIANT_USERNAME / GRAPHIANT_PASSWORD (and GRAPHIANT_HOST) for password login.
# Token is tried first. You can also override any of these with -e graphiant_host=... etc.
#
# Usage:
#   Configure (create OR update — idempotent):
#     Creates policies that don't exist and updates those that do. To update, edit the config
#     file and re-run this same command; unchanged policies are skipped.
#     ansible-playbook data_assurance_management.yml --tags configure \
#       -e "config_file=sample_data_assurance_policies.yaml"
#
#   Deconfigure:
#     ansible-playbook data_assurance_management.yml --tags deconfigure \
#       -e "config_file=sample_data_assurance_policies.yaml"
#
#   Dry run (preview changes without applying):
#     ansible-playbook data_assurance_management.yml --tags configure --check --diff \
#       -e "config_file=sample_data_assurance_policies.yaml"

- name: Data Assurance Policy Management
  hosts: localhost
  gather_facts: false
  vars:
    config_file: "sample_data_assurance_policies.yaml"
    # graphiant_host: "https://api.graphiant.com"
    # graphiant_username: "{{ vault_graphiant_username }}"
    # graphiant_password: "{{ vault_graphiant_password }}"

    # Use YAML anchors to avoid repetition. Falls back to environment variables
    # when the vars above are not set.
    graphiant_client_params: &graphiant_client_params
      host: "{{ graphiant_host | default(lookup('env', 'GRAPHIANT_HOST')) }}"
      username: "{{ graphiant_username | default(lookup('env', 'GRAPHIANT_USERNAME')) }}"
      password: "{{ graphiant_password | default(lookup('env', 'GRAPHIANT_PASSWORD')) }}"
      access_token: "{{ graphiant_access_token | default(lookup('env', 'GRAPHIANT_ACCESS_TOKEN')) }}"

  tasks:
    - name: Configure Data Assurance policies
      graphiant.naas.graphiant_data_assurance:
        <<: *graphiant_client_params
        operation: configure
        data_assurance_config_file: "{{ config_file }}"
        detailed_logs: "{{ detailed_logs | default(false) }}"
      register: da_configure_result
      tags: configure

    - name: Show configure result
      ansible.builtin.debug:
        msg: |
          {{ da_configure_result.msg }}
          configured={{ da_configure_result.configured | default([]) }}
          skipped={{ da_configure_result.skipped_policies | default([]) }}
      when: da_configure_result is defined and da_configure_result.msg is defined
      tags: configure

    - name: Deconfigure Data Assurance policies
      graphiant.naas.graphiant_data_assurance:
        <<: *graphiant_client_params
        operation: deconfigure
        data_assurance_config_file: "{{ config_file }}"
        detailed_logs: "{{ detailed_logs | default(false) }}"
      register: da_deconfigure_result
      tags: deconfigure

    - name: Show deconfigure result
      ansible.builtin.debug:
        msg: |
          {{ da_deconfigure_result.msg }}
          deleted={{ da_deconfigure_result.deleted | default([]) }}
          skipped={{ da_deconfigure_result.skipped_policies | default([]) }}
      when: da_deconfigure_result is defined and da_deconfigure_result.msg is defined
      tags: deconfigure
